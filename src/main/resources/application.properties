# ============================================================
# Notification Platform — Application Configuration
# Phase 0: Bootstrap
#
# RULE: Never hardcode secrets or passwords here.
# For secrets, use environment variables or a secrets manager.
# ============================================================

# --- Server ---
# The port on which the embedded Tomcat listens.
# Override with: java -jar app.jar --server.port=9090
# Or via env var: SERVER_PORT=9090
server.port=8080

# Application context path — all URLs will be prefixed with this.
# Keeping it at root (/) is conventional for a single-service app.
server.servlet.context-path=/

# --- Application Info ---
spring.application.name=notification-platform

# --- Actuator ---
# Expose the health and info endpoints over HTTP.
# In production you would restrict this or move to a separate management port.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application info shown at /actuator/info
info.app.name=Notification Platform
info.app.description=Distributed Notification Platform
info.app.version=0.0.1-SNAPSHOT
info.app.phase=Phase 0 - Bootstrap

# --- Logging ---
# ROOT level: INFO is appropriate for production.
# Use DEBUG only for local troubleshooting (generates a lot of output).
logging.level.root=INFO
logging.level.com.notificationplatform=DEBUG
